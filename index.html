        { rank: "2", h: "Mehr Abwechslung / weniger 'schmeckt alles \xE4hnlich'", why: "Abwechslung ist unsere schw\xE4chste Bewertung (3,42), 35 G\xE4ste waren unzufrieden. Das sch\xE4rfste Freitext-Thema: Gerichte 'schmecken \xE4hnlich, egal wie sie hei\xDFen', 'immer Lasagne dabei', 'gef\xFChlt fast jede Woche das gleiche Men\xFC'. Manche empfinden die Lasagne sogar als 'eingekochte Dal-Reste'.", do: "Kontrast zwischen den 3 Tagesgerichten erh\xF6hen \u2014 verschiedene Gew\xFCrzbasis, Textur und Finish, nicht drei tomatenlastige Gerichte. Sicherstellen, dass jedes Gericht wirklich nach seinem Namen schmeckt. Das 4-Wochen-Rad muss sich Woche f\xFCr Woche echt unterschiedlich anf\xFChlen." },
        { rank: "3", h: "Sch\xE4rfe: eine klare Skala anbieten, nicht nur eine Mitte", why: "Sch\xE4rfe spaltet: 20 Freitext-Nennungen wollen es sch\xE4rfer, 10 wollen es milder. In den Bewertungen wollen mehr G\xE4ste 'sch\xE4rfer' als 'milder'. Alles auf ein europ\xE4isch-mildes Niveau zu trimmen befriedigt keine Seite und l\xE4sst Gerichte f\xFCr Sch\xE4rfe-Fans flach schmecken.", do: "Basis auf einem freundlichen europ\xE4ischen Niveau halten (wie Simone es will), ABER Chili/Sch\xE4rfe extra dazu anbieten, oder eines der drei Tagesgerichte als 'scharf' markieren. Notieren, wo ein Gericht mit extra Sch\xE4rfe separat serviert werden sollte. Das l\xF6st beide Seiten auf einmal." },
        { rank: "4", h: "Portionen sch\xFCtzen \u2014 NICHT verkleinern", why: "Portionsgr\xF6\xDFe ist gespalten: 65 sehr zufrieden, aber 35 unzufrieden \u2014 und der Freitext ist laut und deutlich: 'reduziert die Portionen nicht', 'alte Portionsgr\xF6\xDFe zur\xFCck', 'bitte behaltet die Portionen'. Hier ist echte Sorge sp\xFCrbar. Einige wollen weniger Kartoffeln/Kohlenhydrate (Kartoffel + Reis = zu viel St\xE4rke), nicht weniger Essen.", do: "Portionsgr\xF6\xDFe halten. Wo es kohlenhydratlastig wirkt, Kartoffel durch Protein oder Gem\xFCse ersetzen statt die Menge zu k\xFCrzen. Wahrgenommener Wert h\xE4ngt an der Portion \u2014 Verkleinern w\xFCrde unsere schw\xE4chste Bewertung (Preis-Leistung, 3,59) hart treffen." },
