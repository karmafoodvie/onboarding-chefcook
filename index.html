    // ═══════════════════════════════════════════════════════════
    async function loadProgress() {
      const { data, error } = await supabase
        .from("onboarding_progress").select("state").eq("user_id", USER_ID).maybeSingle();
      if (error) { console.error(error); return {}; }
      return data?.state || {};
    }
    async function saveProgress(state) {
      const { error } = await supabase
        .from("onboarding_progress")
        .upsert({ user_id: USER_ID, state, updated_at: new Date().toISOString() });
      if (error) console.error(error);
    }
    async function loadNotes() {
      const { data, error } = await supabase
        .from("onboarding_notes").select("notes").eq("user_id", USER_ID).maybeSingle();
      if (error) { console.error(error); return {}; }
      return data?.notes || {};
    }
    async function saveNotes(notes) {
      const { error } = await supabase
        .from("onboarding_notes")
        .upsert({ user_id: USER_ID, notes, updated_at: new Date().toISOString() });
      if (error) console.error(error);
    }

    // debounce helper for notes (don't hammer the DB on every keystroke)
    function debounce(fn, ms) {
      let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }
    const saveNotesDebounced = debounce(saveNotes, 700);

    // ── CONTENT (the editable program: weeks/days/tasks/goals) ──
    async function loadContent() {
      const { data, error } = await supabase
        .from("onboarding_content").select("data").eq("id", "program").maybeSingle();
      if (error) { console.error(error); return null; }
      return data?.data || null;
    }
    async function saveContent(program) {
      const { error } = await supabase
        .from("onboarding_content")
        .upsert({ id: "program", data: program, updated_at: new Date().toISOString() });
      if (error) { console.error(error); return false; }
      return true;
    }

    async function adminSignOut() {
      return supabase.auth.signOut();
    }
    async function getSession() {
      const { data } = await supabase.auth.getSession();
      return data?.session || null;
    }

    // ── LOGIN MODAL (admin only) ──────────────────────────────
    function LoginModal({ onClose }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setLoading(true); setError("");
        const { error } = await adminSignIn(email, password);
        setLoading(false);
        if (error) { setError("Login failed — check email & password."); return; }
        onClose();
      };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 60, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={onClose}>
          <form onClick={(e) => e.stopPropagation()} onSubmit={submit}
            style={{ background: "white", borderRadius: 16, padding: "28px 26px", width: 340, maxWidth: "100%", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <div style={{ width: 34, height: 34, borderRadius: 9, background: INK, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <IconLock size={17} color={NEON} />
              </div>
              <div style={{ fontWeight: 800, fontSize: 18 }}>Admin login</div>
            </div>
            <p style={{ fontSize: 13, color: "#888", margin: "0 0 18px" }}>
              Sign in to edit weeks, tasks and goals. Dinesh does not need this.
            </p>
            <label style={{ fontSize: 12.5, fontWeight: 700, color: "#555" }}>Email</label>
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
              style={{ width: "100%", padding: "10px 12px", margin: "6px 0 14px", border: "2px solid #eee", borderRadius: 9, fontSize: 14.5, boxSizing: "border-box" }} />
            <label style={{ fontSize: 12.5, fontWeight: 700, color: "#555" }}>Password</label>
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
              style={{ width: "100%", padding: "10px 12px", margin: "6px 0 6px", border: "2px solid #eee", borderRadius: 9, fontSize: 14.5, boxSizing: "border-box" }} />
            {error && <div style={{ color: "#C0392B", fontSize: 13, margin: "6px 0" }}>{error}</div>}
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button type="button" onClick={onClose} style={{ flex: 1, padding: "11px 0", background: "#f2f2f2", border: "none", borderRadius: 9, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Cancel</button>

      const [saveStatus, setSaveStatus] = useState("");    // "", "saving", "saved"

      useEffect(() => {
        loadProgress().then((p) => setProgress(p || {}));
        loadNotes().then((n) => setNotes(n || {}));
        loadContent().then((c) => setProgram(c || DEFAULT_PROGRAM));
        getSession().then(setSession);
        const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => setSession(sess));
        return () => sub?.subscription?.unsubscribe();
      }, []);

      const isAdmin = !!session;

      const toggle = (key) => {
        const next = { ...progress, [key]: !progress[key] };
        setProgress(next); saveProgress(next);
      };
      const setNote = (key, value) => {
        const next = { ...notes, [key]: value };
        setNotes(next); saveNotesDebounced(next);
      };

      // Admin edit: update program in local state immediately (so the
      // UI feels instant), then persist the whole object to Supabase.
      const updateProgram = (mutatorFn) => {
        setProgram((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          mutatorFn(next);
          setSaveStatus("saving");
          saveContent(next).then((ok) => setSaveStatus(ok ? "saved" : "error"));
          return next;
        });
      };

      if (progress === null || program === null || session === undefined) {
        return (<div style={{ minHeight: "100vh", background: CREAM, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui" }}>
          <div style={{ color: INK, fontSize: 18 }}>Loading…</div></div>);
      }

      const weekProgress = (w) => {
        const total = w.checklist.length;
        const done = w.checklist.filter((_, i) => progress[`${w.id}_goal_${i}`]).length;
        return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
      };
      const overallPct = (() => {
        let done = 0, total = 0;
        program.weeks.forEach((w) => {
          w.checklist.forEach((_, i) => { total++; if (progress[`${w.id}_goal_${i}`]) done++; });
          w.days.forEach((d, di) => d.items.forEach((_, ii) => { total++; if (progress[`${w.id}_d${di}_${ii}`]) done++; }));
        });
        return total ? Math.round((done / total) * 100) : 0;
      })();

      const NAV = [
        { key: "home", label: "Home", Icon: IconHome },
        ...program.weeks.map((w) => ({ key: w.id, label: w.label, Icon: IconCal, week: w })),
        { key: "resp", label: "Responsibilities", Icon: IconChef },
        { key: "signoff", label: "Daily Sign-off", Icon: IconClip },
      ];
      const go = (t, w) => { setView({ type: t, week: w }); setMenuOpen(false); window.scrollTo(0, 0); };

      return (
        <div style={{ minHeight: "100vh", background: CREAM, fontFamily: "'Segoe UI', system-ui, sans-serif", color: INK }}>
          <header style={{ background: INK, color: CREAM, position: "sticky", top: 0, zIndex: 50, boxShadow: "0 2px 12px rgba(0,0,0,0.15)" }}>
            <div style={{ maxWidth: 1000, margin: "0 auto", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }} onClick={() => go("home")}>
                <div style={{ width: 34, height: 34, background: NEON, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <IconChef size={20} color={INK} sw={2.5} />
                </div>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 15, letterSpacing: 0.3 }}>KARMA FOOD</div>
                  <div style={{ fontSize: 11, opacity: 0.7 }}>Head Chef Onboarding</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {isAdmin && (
                  <span style={{ fontSize: 11, fontWeight: 700, color: INK, background: NEON, padding: "5px 10px", borderRadius: 99, display: "flex", alignItems: "center", gap: 5 }}>
                    <IconEdit size={12} color={INK} /> ADMIN
                  </span>
                )}
                <button onClick={() => isAdmin ? adminSignOut() : setLoginOpen(true)}
                  style={{ background: "transparent", border: "1px solid rgba(255,255,255,0.25)", color: CREAM, cursor: "pointer", padding: "6px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 600 }}>
                  {isAdmin ? "Log out" : "Admin"}
                </button>
                <button onClick={() => setMenuOpen(!menuOpen)} style={{ background: "transparent", border: "none", color: CREAM, cursor: "pointer", padding: 6 }}>
                  {menuOpen ? <IconX size={26} color={CREAM} /> : <IconMenu size={26} color={CREAM} />}
                </button>
              </div>
            </div>
            <div style={{ background: "#1E1E2E", padding: "6px 20px" }}>
              <div style={{ maxWidth: 1000, margin: "0 auto", display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 11, opacity: 0.75, whiteSpace: "nowrap" }}>Overall progress</span>
                <div style={{ flex: 1, height: 6, background: "rgba(255,255,255,0.12)", borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ width: `${overallPct}%`, height: "100%", background: NEON, transition: "width .4s" }} />
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, color: NEON }}>{overallPct}%</span>
              </div>
            </div>
          </header>

          {loginOpen && !isAdmin && <LoginModal onClose={() => setLoginOpen(false)} />}

          {menuOpen && (
            <div style={{ position: "fixed", inset: 0, zIndex: 40, background: "rgba(0,0,0,0.4)" }} onClick={() => setMenuOpen(false)}>
              <nav onClick={(e) => e.stopPropagation()} style={{ position: "absolute", right: 0, top: 0, bottom: 0, width: 280, maxWidth: "80vw", background: CREAM, padding: "88px 16px 24px", overflowY: "auto", boxShadow: "-4px 0 20px rgba(0,0,0,0.2)" }}>
                {NAV.map((n) => {
                  const active = (view.type === n.key) || (view.type === "week" && view.week?.id === n.key);
                  return (<button key={n.key} onClick={() => go(n.week ? "week" : n.key, n.week)}
                    style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", marginBottom: 4, background: active ? INK : "transparent", color: active ? CREAM : INK, border: "none", borderRadius: 10, cursor: "pointer", fontSize: 15, fontWeight: 600, textAlign: "left" }}>
                    <n.Icon size={18} color={active ? CREAM : INK} /> {n.label}</button>);
                })}
              </nav>
            </div>
          )}

          <main style={{ maxWidth: 1000, margin: "0 auto", padding: "28px 20px 80px" }}>
            {view.type === "home" && <HomeView program={program} go={go} weekProgress={weekProgress} />}
            {view.type === "week" && <WeekView program={program} week={program.weeks.find(w => w.id === view.week.id) || view.week} progress={progress} toggle={toggle} weekProgress={weekProgress} go={go} notes={notes} setNote={setNote} isAdmin={isAdmin} updateProgram={updateProgram} saveStatus={saveStatus} />}
            {view.type === "resp" && <RespView program={program} />}
            {view.type === "signoff" && <SignoffView program={program} />}
          </main>
        </div>
      );
    }

    // ── HOME ──────────────────────────────────────────────────
    function HomeView({ program, go, weekProgress }) {
      return (<div>
        <div style={{ background: INK, borderRadius: 20, padding: "40px 32px", color: CREAM, position: "relative", overflow: "hidden", marginBottom: 28 }}>
          <div style={{ position: "absolute", top: -40, right: -40, width: 180, height: 180, background: NEON, opacity: 0.12, borderRadius: "50%" }} />
          <div style={{ position: "absolute", bottom: -60, left: -20, width: 140, height: 140, background: ORANGE, opacity: 0.15, borderRadius: "50%" }} />
          <div style={{ position: "relative" }}>
            <div style={{ display: "inline-block", background: NEON, color: INK, fontSize: 12, fontWeight: 800, padding: "5px 12px", borderRadius: 99, letterSpacing: 0.5, marginBottom: 16 }}>WELCOME, DINESH 🌱</div>
            <h1 style={{ fontSize: 34, fontWeight: 800, margin: "0 0 12px", lineHeight: 1.1 }}>{program.intro.title}</h1>
            <p style={{ fontSize: 17, opacity: 0.85, margin: 0, fontWeight: 500 }}>{program.intro.subtitle}</p>
          </div>
        </div>
        <div style={{ background: "white", borderRadius: 16, padding: "24px 26px", marginBottom: 24, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
          {program.intro.body.map((t, i) => <p key={i} style={{ fontSize: 15.5, lineHeight: 1.65, color: "#333", margin: i === 0 ? "0 0 14px" : 0 }}>{t}</p>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 14, marginBottom: 30 }}>
          {program.intro.principles.map((p, i) => (
            <div key={i} style={{ background: "white", borderRadius: 14, padding: 20, borderTop: `4px solid ${ORANGE}`, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
              <div style={{ width: 42, height: 42, borderRadius: 10, background: CREAM, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 12 }}><IconFlame color={ORANGE} /></div>
              <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>{p.title}</div>
              <div style={{ fontSize: 14, color: "#555", lineHeight: 1.5 }}>{p.text}</div>
            </div>))}
        </div>
        <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 16px" }}>Your 4-Week Plan</h2>
        <div style={{ display: "grid", gap: 14 }}>
          {program.weeks.map((w) => {
            const wp = weekProgress(w);
            return (<button key={w.id} onClick={() => go("week", w)}
              style={{ background: "white", borderRadius: 16, padding: "22px 24px", border: "none", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 18, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", borderLeft: `6px solid ${w.color}` }}>
              <div style={{ minWidth: 54, height: 54, borderRadius: 12, background: w.color, color: "white", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontWeight: 800 }}>
                <span style={{ fontSize: 10, opacity: 0.85 }}>WEEK</span>
                <span style={{ fontSize: 22, lineHeight: 1 }}>{w.label.split(" ")[1]}</span>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 17, marginBottom: 3 }}>{w.theme}</div>
                <div style={{ fontSize: 13, color: "#888", marginBottom: 8 }}>{w.dates}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, maxWidth: 160, height: 6, background: "#eee", borderRadius: 99, overflow: "hidden" }}>
                    <div style={{ width: `${wp.pct}%`, height: "100%", background: w.color }} />
                  </div>
                  <span style={{ fontSize: 12, color: "#999", fontWeight: 600 }}>{wp.done}/{wp.total} goals</span>
                </div>
              </div>
              <IconChevron size={22} color="#ccc" />
            </button>);
          })}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 24 }}>
          <button onClick={() => go("resp")} style={{ background: INK, color: CREAM, border: "none", borderRadius: 14, padding: 20, cursor: "pointer", textAlign: "left" }}>
            <IconChef size={24} color={NEON} />
            <div style={{ fontWeight: 700, fontSize: 15, marginTop: 10 }}>Your Responsibilities</div>
            <div style={{ fontSize: 12.5, opacity: 0.7, marginTop: 3 }}>What you own as Head Chef</div>
          </button>
          <button onClick={() => go("signoff")} style={{ background: ORANGE, color: "white", border: "none", borderRadius: 14, padding: 20, cursor: "pointer", textAlign: "left" }}>
            <IconClip size={24} color="white" />
            <div style={{ fontWeight: 700, fontSize: 15, marginTop: 10 }}>Daily Sign-off</div>
            <div style={{ fontSize: 12.5, opacity: 0.85, marginTop: 3 }}>Your quality gate before delivery</div>
          </button>
        </div>
      </div>);
    }

    // ── Small inline-edit helpers (admin only) ────────────────
    // Uncontrolled + onBlur commit, so typing stays fast even though
    // committing an edit clones & re-saves the whole program object.
    function EditText({ value, onCommit, style, placeholder }) {
      return (
        <input defaultValue={value} placeholder={placeholder}
          onBlur={(e) => { if (e.target.value !== value) onCommit(e.target.value); }}
          style={{ border: "2px dashed #cfcfcf", borderRadius: 8, padding: "6px 9px", fontSize: 14, width: "100%", background: "#fffef8", ...style }} />
      );
    }
    function EditArea({ value, onCommit, style, placeholder, rows = 2 }) {
      return (
        <textarea defaultValue={value} placeholder={placeholder} rows={rows}
          onBlur={(e) => { if (e.target.value !== value) onCommit(e.target.value); }}
          style={{ border: "2px dashed #cfcfcf", borderRadius: 8, padding: "8px 10px", fontSize: 14, width: "100%", background: "#fffef8", resize: "vertical", fontFamily: "inherit", ...style }} />
      );
    }
    function SaveBadge({ status }) {
      if (!status) return null;
      const map = {
        saving: { text: "Saving…", color: "#999" },
        saved:  { text: "Saved ✓", color: SAGE },
        error:  { text: "Save failed", color: "#C0392B" },
      };
      const m = map[status]; if (!m) return null;
      return <span style={{ fontSize: 12, fontWeight: 700, color: m.color, marginLeft: 10 }}>{m.text}</span>;
    }

    // ── WEEK ──────────────────────────────────────────────────
    function WeekView({ program, week, progress, toggle, weekProgress, go, notes, setNote, isAdmin, updateProgram, saveStatus }) {
      const wp = weekProgress(week);
      const noteKey = `${week.id}_notes`;
      const wIdx = program.weeks.findIndex((w) => w.id === week.id);

      const editWeekField = (field, value) => updateProgram((p) => { p.weeks[wIdx][field] = value; });
      const editDayField = (di, field, value) => updateProgram((p) => { p.weeks[wIdx].days[di][field] = value; });
      const editTask = (di, ii, value) => updateProgram((p) => { p.weeks[wIdx].days[di].items[ii] = value; });
      const addTask = (di) => updateProgram((p) => { p.weeks[wIdx].days[di].items.push("New task…"); });
      const removeTask = (di, ii) => updateProgram((p) => { p.weeks[wIdx].days[di].items.splice(ii, 1); });
      const addDay = () => updateProgram((p) => { p.weeks[wIdx].days.push({ day: "New day", tag: "Label", items: ["New task…"] }); });
      const removeDay = (di) => updateProgram((p) => { p.weeks[wIdx].days.splice(di, 1); });
      const editGoal = (i, value) => updateProgram((p) => { p.weeks[wIdx].checklist[i] = value; });
      const addGoal = () => updateProgram((p) => { p.weeks[wIdx].checklist.push("New goal…"); });
      const removeGoal = (i) => updateProgram((p) => { p.weeks[wIdx].checklist.splice(i, 1); });

      return (<div>
        <button onClick={() => go("home")} style={{ background: "none", border: "none", color: "#888", cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", gap: 5, marginBottom: 16, padding: 0 }}>
          <IconHome size={15} color="#888" /> Home</button>

        {isAdmin && (
          <div style={{ background: NEON, borderRadius: 10, padding: "8px 14px", marginBottom: 16, display: "flex", alignItems: "center", fontSize: 13, fontWeight: 700, color: INK }}>
            <IconEdit size={14} color={INK} /> <span style={{ marginLeft: 7 }}>Admin edit mode — click any dashed box to change it</span>
            <SaveBadge status={saveStatus} />
          </div>
        )}

        <div style={{ background: week.color, borderRadius: 18, padding: "30px 28px", color: "white", marginBottom: 22, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: -30, right: -30, width: 130, height: 130, background: "rgba(255,255,255,0.1)", borderRadius: "50%" }} />
          <div style={{ position: "relative" }}>
            <div style={{ fontSize: 13, opacity: 0.85, fontWeight: 600, letterSpacing: 0.5 }}>{week.label.toUpperCase()} · {week.dates}</div>
            {isAdmin ? (
              <div style={{ margin: "8px 0" }}>
                <EditText value={week.theme} onCommit={(v) => editWeekField("theme", v)} style={{ fontSize: 22, fontWeight: 800, color: INK, marginBottom: 6 }} />
                <EditText value={week.motto} onCommit={(v) => editWeekField("motto", v)} style={{ fontSize: 14, fontStyle: "italic", color: INK }} />
              </div>
            ) : (<>
              <h1 style={{ fontSize: 30, fontWeight: 800, margin: "6px 0 8px" }}>{week.theme}</h1>
              <div style={{ fontSize: 16, fontStyle: "italic", opacity: 0.92 }}>{week.motto}</div>
            </>)}
          </div>
        </div>

        <div style={{ background: INK, color: CREAM, borderRadius: 14, padding: "20px 22px", marginBottom: 24, display: "flex", gap: 14 }}>
          <IconTarget size={24} color={NEON} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: NEON, letterSpacing: 0.5, marginBottom: 6 }}>GOAL FOR THIS WEEK</div>
            {isAdmin
              ? <EditArea value={week.goal} onCommit={(v) => editWeekField("goal", v)} rows={3} style={{ background: "#232336", color: CREAM, borderColor: "#444" }} />
              : <div style={{ fontSize: 15, lineHeight: 1.6 }}>{week.goal}</div>}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
          <h2 style={{ fontSize: 19, fontWeight: 800, margin: 0 }}>Daily Plan</h2>
          {isAdmin && (
            <button onClick={addDay} style={{ display: "flex", alignItems: "center", gap: 5, background: "white", border: `1.5px dashed ${week.color}`, color: week.color, borderRadius: 8, padding: "6px 11px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
              <IconPlus size={14} color={week.color} /> Add day
            </button>
          )}
        </div>

        <div style={{ display: "grid", gap: 14, marginBottom: 28 }}>
          {week.days.map((d, di) => (
            <div key={di} style={{ background: "white", borderRadius: 14, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
              <div style={{ padding: "14px 20px", borderBottom: "1px solid #f0f0f0", display: "flex", alignItems: "center", justifyContent: "space-between", background: CREAM, gap: 10 }}>
                {isAdmin ? (
                  <>
                    <EditText value={d.day} onCommit={(v) => editDayField(di, "day", v)} style={{ fontWeight: 700, fontSize: 14, flex: 1 }} />
                    <EditText value={d.tag} onCommit={(v) => editDayField(di, "tag", v)} style={{ fontSize: 12, width: 140, color: week.color }} />
                    <button onClick={() => removeDay(di)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}><IconTrash size={16} color="#C0392B" /></button>
                  </>
                ) : (<>
                  <span style={{ fontWeight: 700, fontSize: 15 }}>{d.day}</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: week.color, background: `${week.color}18`, padding: "4px 10px", borderRadius: 99 }}>{d.tag}</span>
                </>)}
              </div>
              <div style={{ padding: "8px 20px 14px" }}>
                {d.items.map((it, ii) => {
                  const key = `${week.id}_d${di}_${ii}`; const done = progress[key];
                  if (isAdmin) {
                    return (
                      <div key={ii} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0" }}>
                        <EditText value={it} onCommit={(v) => editTask(di, ii, v)} style={{ flex: 1 }} />
                        <button onClick={() => removeTask(di, ii)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, flexShrink: 0 }}><IconTrash size={15} color="#C0392B" /></button>
                      </div>
                    );
                  }
                  return (<button key={ii} onClick={() => toggle(key)}
                    style={{ width: "100%", display: "flex", alignItems: "flex-start", gap: 11, padding: "9px 0", background: "none", border: "none", cursor: "pointer", textAlign: "left", borderBottom: ii < d.items.length - 1 ? "1px solid #f6f6f6" : "none" }}>
                    {done ? <IconCheckCircle size={20} color={SAGE} /> : <IconCircle size={20} color="#ccc" />}
                    <span style={{ fontSize: 14.5, color: done ? "#aaa" : "#333", textDecoration: done ? "line-through" : "none", lineHeight: 1.45 }}>{it}</span>
                  </button>);
                })}
                {isAdmin && (
                  <button onClick={() => addTask(di)} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: week.color, cursor: "pointer", fontSize: 13, fontWeight: 700, padding: "8px 0 2px" }}>
                    <IconPlus size={13} color={week.color} /> Add task
                  </button>
                )}
              </div>
            </div>))}
        </div>

        <div style={{ background: "white", borderRadius: 16, padding: "22px 24px", boxShadow: "0 1px 3px rgba(0,0,0,0.06)", border: `2px solid ${week.color}25` }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            <h3 style={{ fontSize: 17, fontWeight: 800, margin: 0, display: "flex", alignItems: "center", gap: 8 }}><IconStar size={18} color={week.color} /> End-of-Week Goals</h3>
            {isAdmin
              ? <button onClick={addGoal} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1.5px dashed ${week.color}`, color: week.color, borderRadius: 8, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}><IconPlus size={13} color={week.color} /> Add goal</button>
              : <span style={{ fontSize: 13, fontWeight: 700, color: week.color }}>{wp.done}/{wp.total}</span>}
          </div>
          {week.checklist.map((c, i) => {
            const key = `${week.id}_goal_${i}`; const done = progress[key];
            if (isAdmin) {
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0" }}>
                  <EditText value={c} onCommit={(v) => editGoal(i, v)} style={{ flex: 1 }} />
                  <button onClick={() => removeGoal(i)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, flexShrink: 0 }}><IconTrash size={15} color="#C0392B" /></button>
                </div>
              );
            }
            return (<button key={i} onClick={() => toggle(key)}
              style={{ width: "100%", display: "flex", alignItems: "flex-start", gap: 11, padding: "11px 0", background: "none", border: "none", cursor: "pointer", textAlign: "left", borderBottom: i < week.checklist.length - 1 ? "1px solid #f6f6f6" : "none" }}>
              <div style={{ width: 22, height: 22, borderRadius: 6, border: done ? "none" : "2px solid #ddd", background: done ? week.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>
                {done && <IconCheck size={15} color="white" sw={3} />}
              </div>
              <span style={{ fontSize: 15, color: done ? "#aaa" : "#222", fontWeight: 500, textDecoration: done ? "line-through" : "none", lineHeight: 1.45 }}>{c}</span>
            </button>);
          })}
          {!isAdmin && wp.pct === 100 && (<div style={{ marginTop: 16, padding: "12px 16px", background: `${SAGE}15`, borderRadius: 10, display: "flex", alignItems: "center", gap: 10, color: SAGE, fontWeight: 700, fontSize: 14 }}>
            <IconCheckCircle size={20} color={SAGE} /> Week complete — great work! 🎉</div>)}
        </div>

        {!isAdmin && (
          <div style={{ background: "white", borderRadius: 16, padding: "22px 24px", marginTop: 18, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
            <h3 style={{ fontSize: 17, fontWeight: 800, margin: "0 0 4px", display: "flex", alignItems: "center", gap: 8 }}><IconMsg size={18} color={week.color} /> My Notes</h3>
            <p style={{ fontSize: 13, color: "#999", margin: "0 0 12px" }}>Write down questions, observations or ideas. Saved automatically.</p>
            <textarea value={notes[noteKey] || ""} onChange={(e) => setNote(noteKey, e.target.value)}
              placeholder="Type your notes for this week here…"
              style={{ width: "100%", minHeight: 130, resize: "vertical", border: "2px solid #eee", borderRadius: 12, padding: "14px 16px", fontSize: 15, lineHeight: 1.55, color: "#333", outline: "none", background: CREAM }}
              onFocus={(e) => (e.target.style.borderColor = week.color)} onBlur={(e) => (e.target.style.borderColor = "#eee")} />
          </div>
        )}

        {isAdmin && notes[noteKey] && (
          <div style={{ background: "#FFF8DC", borderRadius: 16, padding: "18px 22px", marginTop: 18, border: "1px solid #eee0b0" }}>
            <h3 style={{ fontSize: 14, fontWeight: 800, margin: "0 0 8px", color: "#8a6d00" }}>Dinesh's notes for this week</h3>
            <p style={{ fontSize: 14, lineHeight: 1.55, margin: 0, color: "#444", whiteSpace: "pre-wrap" }}>{notes[noteKey]}</p>
          </div>
        )}

        {(() => {
          const next = program.weeks[wIdx + 1];
          if (!next) return null;
          return (<button onClick={() => go("week", next)} style={{ marginTop: 20, width: "100%", background: INK, color: CREAM, border: "none", borderRadius: 14, padding: "18px 22px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ textAlign: "left" }}>
              <div style={{ fontSize: 12, opacity: 0.7 }}>NEXT</div>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{next.label}: {next.theme}</div>
            </div>
            <IconArrow size={22} color={NEON} />
          </button>);
        })()}
      </div>);
    }

    // ── RESPONSIBILITIES ──────────────────────────────────────
    function RespView({ program }) {
      const R = program.responsibilities;
      return (<div>
        <h1 style={{ fontSize: 28, fontWeight: 800, margin: "0 0 6px" }}>{R.title}</h1>
        <p style={{ fontSize: 15.5, color: "#666", margin: "0 0 24px" }}>{R.subtitle}</p>

        {/* TEAM OVERVIEW */}
        {R.team && (
          <div style={{ background: INK, color: CREAM, borderRadius: 16, padding: "24px 26px", marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <IconUsers size={22} color={NEON} />
              <h3 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>{R.team.title}</h3>
            </div>
            <p style={{ fontSize: 15, lineHeight: 1.65, margin: 0, opacity: 0.9 }}>{R.team.text}</p>
          </div>
        )}

        {/* SHARED LEADERSHIP */}
        {R.leadership && (
          <div style={{ background: NEON, color: INK, borderRadius: 16, padding: "24px 26px", marginBottom: 28 }}>
            <h3 style={{ fontSize: 18, fontWeight: 800, margin: "0 0 8px" }}>{R.leadership.title}</h3>
            <p style={{ fontSize: 15, lineHeight: 1.65, margin: 0, fontWeight: 500 }}>{R.leadership.text}</p>
          </div>
        )}

        {/* DINESH RESPONSIBILITIES */}
        <h2 style={{ fontSize: 20, fontWeight: 800, margin: "0 0 14px", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: ORANGE, display: "inline-block" }} />
          {R.yoursTitle || "Your Responsibilities"}
        </h2>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 14, marginBottom: 28 }}>
          {R.yours.map((r, i) => (
            <div key={i} style={{ background: "white", borderRadius: 14, padding: 22, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", borderTop: `4px solid ${ORANGE}` }}>
              <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 7 }}>{r.title}</div>
              <div style={{ fontSize: 14, color: "#555", lineHeight: 1.55 }}>{r.text}</div>
            </div>))}
        </div>

        {/* NOORU RESPONSIBILITIES */}
        {R.nooru && (<>
          <h2 style={{ fontSize: 20, fontWeight: 800, margin: "0 0 14px", display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 10, height: 10, borderRadius: "50%", background: SAGE, display: "inline-block" }} />
            {R.nooruTitle || "Nooru's Responsibilities"}
          </h2>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 14, marginBottom: 28 }}>
            {R.nooru.map((r, i) => (
              <div key={i} style={{ background: "white", borderRadius: 14, padding: 22, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", borderTop: `4px solid ${SAGE}` }}>
                <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 7 }}>{r.title}</div>
                <div style={{ fontSize: 14, color: "#555", lineHeight: 1.55 }}>{r.text}</div>
              </div>))}
          </div>
        </>)}

        {/* HOW TO WORK WITH NOORU */}
        <div style={{ background: SAGE, color: "white", borderRadius: 16, padding: "26px 28px", marginBottom: 28 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}><IconUsers size={24} color="white" /><h3 style={{ fontSize: 19, fontWeight: 800, margin: 0 }}>{R.sous.title}</h3></div>
          <p style={{ fontSize: 15.5, lineHeight: 1.65, margin: 0, opacity: 0.95 }}>{R.sous.text}</p>
        </div>

        {/* WORKING STYLE */}
        {R.working && (
          <div style={{ background: "white", borderRadius: 16, padding: "26px 28px", boxShadow: "0 1px 3px rgba(0,0,0,0.06)", borderTop: `4px solid ${NEON}` }}>
            <h3 style={{ fontSize: 19, fontWeight: 800, margin: "0 0 14px" }}>{R.working.title}</h3>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 9, marginBottom: 14 }}>
              {R.working.values.map((v, i) => (
                <span key={i} style={{ fontSize: 13.5, fontWeight: 700, color: INK, background: CREAM, border: "1.5px solid #eadfae", padding: "7px 14px", borderRadius: 99 }}>{v}</span>
              ))}
            </div>
            <p style={{ fontSize: 15.5, lineHeight: 1.6, margin: 0, color: "#444", fontWeight: 500 }}>{R.working.text}</p>
          </div>
        )}
      </div>);
    }

    // ── SIGN-OFF ──────────────────────────────────────────────
    function SignoffView({ program }) {
      const S = program.signoff;
      return (<div>
        <h1 style={{ fontSize: 28, fontWeight: 800, margin: "0 0 6px" }}>{S.title}</h1>
        <p style={{ fontSize: 15.5, color: "#666", margin: "0 0 20px" }}>{S.subtitle}</p>
        <div style={{ background: ORANGE, color: "white", borderRadius: 14, padding: "20px 24px", marginBottom: 24, fontSize: 15.5, lineHeight: 1.6, fontWeight: 500 }}>{S.text}</div>
        <div style={{ display: "grid", gap: 14 }}>
          {S.steps.map((s) => (
            <div key={s.n} style={{ background: "white", borderRadius: 14, padding: "22px 24px", display: "flex", gap: 18, alignItems: "flex-start", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
              <div style={{ minWidth: 44, height: 44, borderRadius: "50%", background: INK, color: NEON, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 19 }}>{s.n}</div>
              <div><div style={{ fontWeight: 700, fontSize: 16.5, marginBottom: 5 }}>{s.title}</div><div style={{ fontSize: 14.5, color: "#555", lineHeight: 1.55 }}>{s.text}</div></div>
            </div>))}
        </div>
        <div style={{ marginTop: 20, padding: "18px 22px", background: INK, color: CREAM, borderRadius: 14, display: "flex", alignItems: "center", gap: 12, fontSize: 15, fontWeight: 600 }}>
          <IconTruck size={22} color={NEON} /> No approval slip = no departure. Everton only loads after your release.
        </div>
      </div>);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
